name: Build VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target SilkHeat_VST3 SilkSat_VST3 --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/SilkHeat_artefacts/Release/VST3/SilkHeat.vst3 out/
          Copy-Item -Recurse build/SilkSat_artefacts/Release/VST3/SilkSat.vst3 out/
      - uses: actions/upload-artifact@v4
        with:
          name: SilkVST3-Windows
          path: out
