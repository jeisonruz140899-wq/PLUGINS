
name: Build VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar proyecto
        shell: pwsh
        run: |
          $cm = Get-ChildItem -Recurse -Filter CMakeLists.txt | Where-Object { (Get-Content $_.FullName -Raw) -match 'project\(SilkSat' } | Select-Object -First 1
          if (-not $cm) { Write-Host "::error::No encuentro CMakeLists.txt del proyecto. Sube CMakeLists.txt y la carpeta Source al repositorio."; exit 1 }
          "SRC=$($cm.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Proyecto en: $($cm.DirectoryName)"

      - name: Configure
        shell: pwsh
        run: cmake -S "$env:SRC" -B "$env:SRC/build" -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build "$env:SRC/build" --config Release --target SilkHeat_VST3 SilkSat_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "$env:SRC/build/SilkHeat_artefacts/Release/VST3/SilkHeat.vst3" out/
          Copy-Item -Recurse "$env:SRC/build/SilkSat_artefacts/Release/VST3/SilkSat.vst3" out/

      - uses: actions/upload-artifact@v4
        with:
          name: SilkVST3-Windows
          path: out
